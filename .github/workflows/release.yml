name: Android Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Configure Keystore from Secrets (if provided)
        id: keystore_config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.keystore"
            echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV
          else
            echo "No custom release keystore secret found. Build will use debug keystore signing."
          fi

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            gradle :app:assembleRelease --no-daemon --stacktrace
          fi

      - name: Discover and Prepare Release APK
        id: prepare_apk
        run: |
          echo "Scanning for generated release APK..."
          # Find the release APK output
          APK_FILE=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            APK_FILE=$(find . -path "*/build/outputs/apk/*" -type f -name "*release*.apk" | head -n 1)
          fi

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::Release APK was not found after assembleRelease task completed."
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE" 2>/dev/null || wc -c < "$APK_FILE")
          if [ "$FILE_SIZE" -le 0 ]; then
            echo "::error::Generated APK has invalid size: $FILE_SIZE bytes."
            exit 1
          fi

          TAG_NAME="${GITHUB_REF_NAME}"
          DEST_APK_NAME="ArrowPuzzle-${TAG_NAME}.apk"
          cp "$APK_FILE" "$DEST_APK_NAME"

          echo "=========================================="
          echo "Discovered APK: $APK_FILE"
          echo "Package Size:   $FILE_SIZE bytes"
          echo "Release Asset:  $DEST_APK_NAME"
          echo "=========================================="

          echo "apk_path=$DEST_APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$DEST_APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_size=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: Check Pre-release Status
        id: prerelease_status
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v0\. ]] || [[ "$TAG" =~ (alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "Release status: PRE-RELEASE"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Release status: PRODUCTION"
          fi

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: "Arrow Puzzle ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.prerelease_status.outputs.is_prerelease == 'true' }}
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          generate_release_notes: true
          body: |
            # Arrow Puzzle

            Android release build.

            **Version:** `${{ github.ref_name }}`  
            **APK Artifact:** `${{ steps.prepare_apk.outputs.apk_name }}`  
            **File Size:** `${{ steps.prepare_apk.outputs.apk_size }} bytes`

            ### Included
            - Offline arrow puzzle mechanics
            - Smooth state-driven animations
            - Directional collision and blocked-arrow feedback
            - Multiple puzzle grid levels
            - Custom board themes & arrow styling

            ---
            *Development Status: Active Development.*
